name: Probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/fetch/fetch-muftyat-cities.py
          python3 scripts/fetch/fetch-muftyat-times.py
          git add assets
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -m "probe data"
          git push
