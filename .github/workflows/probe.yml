name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          for u in \
            "https://api.muftyat.kz/cities/?format=json" \
            "https://api.muftyat.kz/cities/?format=json&page=2" \
            "https://api.muftyat.kz/prayer-times/2026/51.133333/71.433333" \
            "https://namaz.muftyat.kz/kk/" ; do
            echo "===== $u"
            curl -sS -m 30 -A "$UA" -w '\nHTTP %{http_code}\n' "$u" | head -c 3000
            echo
          done
