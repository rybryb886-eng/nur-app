name: Smoke test

# Re-runs the emulator check on the published preview APK, without rebuilding it.
on:
  push:
    branches: [mvp]
    paths: ['scripts/smoke-test.sh', '.github/workflows/smoke.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Download preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download preview-${{ github.ref_name }} --repo "$GITHUB_REPOSITORY" -p "nur-${{ github.ref_name }}.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/smoke-test.sh nur-${{ github.ref_name }}.apk
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=smoke-${{ github.ref_name }}
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "${{ github.sha }}" \
              --title "Smoke test screenshots (${{ github.ref_name }})" --notes "Screens of the latest build on an Android emulator."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" screen.png shots/*.png --clobber || true
