name: Android APK

on:
  push:
    branches: [main, mvp]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Release build signed with the debug key: fine for sideloading, not for Google Play.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
        env:
          GRADLE_OPTS: -Xmx4g

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk nur-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nur-apk
          path: nur-${{ github.ref_name }}.apk

      - name: Publish to the preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=preview-${{ github.ref_name }}
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --target "${{ github.sha }}" \
              --title "Нұр: тестовая сборка (${{ github.ref_name }})" \
              --notes "APK для установки на Android. Обновляется после каждого изменения ветки ${{ github.ref_name }}."
          gh release upload "$TAG" "nur-${{ github.ref_name }}.apk" --clobber
